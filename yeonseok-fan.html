<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FBF6F1" />
<title>📱 유연석 찐팬의 스마트폰 · 팬 폰 시뮬레이터</title>
<style>
/* ============================================================
   0. 기본 토큰 & 리셋
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#FDF8F5;
  --cream-2:#F7EFE9;
  --pink:#F6C9D4;
  --pink-soft:#FCE7ED;
  --pink-deep:#E394A9;
  --lav:#DCD5F3;
  --lav-soft:#EFEBFB;
  --lav-deep:#A697D6;
  --beige:#F2E4D5;
  --ink:#39313F;
  --ink-2:#5B5266;
  --muted:#9A8EA6;
  --line:rgba(57,49,63,.085);
  --card:#FFFFFF;
  --shadow-xs:0 1px 3px rgba(94,74,105,.07);
  --shadow-sm:0 3px 10px rgba(94,74,105,.08);
  --shadow:0 10px 26px rgba(94,74,105,.13);
  --shadow-lg:0 22px 48px rgba(94,74,105,.18);
  --r-xl:26px;--r-lg:20px;--r-md:14px;--r-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--ink);
  background:
    radial-gradient(110% 70% at 12% -5%, #FDEBF1 0%, rgba(253,235,241,0) 60%),
    radial-gradient(90% 60% at 92% 4%, #ECE6FA 0%, rgba(236,230,250,0) 55%),
    radial-gradient(80% 60% at 50% 110%, #F6E8DA 0%, rgba(246,232,218,0) 60%),
    linear-gradient(165deg,#FCF7F2 0%,#F8F1EC 45%,#F3ECF5 100%);
  min-height:100vh;display:grid;place-items:center;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden;
}
button,input,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
input,textarea{-webkit-appearance:none;appearance:none;border-radius:0}
svg{display:block}
::-webkit-scrollbar{width:0;height:0}

/* ============================================================
   1. 무대 & 폰 프레임
   ============================================================ */
.stage{display:flex;align-items:center;justify-content:center;gap:46px;padding:24px}
.side-note{max-width:250px;color:var(--ink-2);display:none}
.side-note .sn-title{font-size:19px;font-weight:800;letter-spacing:-.4px;margin:0 0 10px;color:var(--ink)}
.side-note .sn-title em{font-style:normal;color:var(--pink-deep)}
.side-note p{font-size:12.5px;line-height:1.85;margin:0 0 14px;color:var(--muted)}
.side-note .sn-chips{display:flex;flex-wrap:wrap;gap:6px}
.side-note .sn-chips span{font-size:11px;padding:5px 9px;border-radius:99px;background:#fff;color:var(--ink-2);box-shadow:var(--shadow-xs)}
@media(min-width:1120px){.side-note{display:block}}

.phone{
  position:relative;width:min(392px,100vw);height:min(848px,100vh);height:min(848px,100dvh);
  background:#fff;border-radius:54px;overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(120,100,130,.10),
    0 0 0 11px #FFFFFF,
    0 0 0 12px rgba(120,100,130,.10),
    0 44px 80px -26px rgba(74,54,86,.42),
    0 12px 26px rgba(74,54,86,.10);
  isolation:isolate;
}
@media(max-width:560px){
  .stage{padding:0;gap:0}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--cream);font-size:14px}

/* 상태 표시줄 */
.statusbar{
  position:relative;z-index:60;flex:0 0 auto;height:46px;display:flex;align-items:center;
  justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;letter-spacing:.2px;
  color:var(--ink);pointer-events:none;transition:color .3s;
}
.statusbar .sb-left,.statusbar .sb-right{display:flex;align-items:center;gap:6px}
.statusbar .sb-icons{display:flex;align-items:center;gap:5px}
.statusbar.dark{color:#fff}
.notch{
  position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:112px;height:27px;border-radius:99px;background:#2A2530;z-index:70;pointer-events:none;
}
.notch::after{content:"";position:absolute;right:12px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#5C6B8A,#20242E 70%);box-shadow:0 0 0 1px rgba(255,255,255,.06)}
@media(max-width:560px){
  .notch{display:none}
  .statusbar{padding-top:env(safe-area-inset-top,0px);height:calc(46px + env(safe-area-inset-top,0px))}
}

/* ============================================================
   2. 잠금 화면
   ============================================================ */
.lock{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;touch-action:none;
  transition:transform .55s cubic-bezier(.32,.72,.25,1),opacity .45s ease;}
.lock.hidden{transform:translateY(-102%);opacity:0;pointer-events:none}
.lock-bg{position:absolute;inset:0;overflow:hidden}
.lock-bg svg{width:100%;height:100%;object-fit:cover}
.lock-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,36,52,.20) 0%,rgba(42,36,52,.02) 32%,rgba(42,36,52,.30) 78%,rgba(42,36,52,.46) 100%)}
.lock-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:calc(52px + env(safe-area-inset-top,0px)) 26px 0;color:#fff;min-height:0;overflow:hidden}
.lock-date{font-size:13.5px;font-weight:600;letter-spacing:.3px;opacity:.92;text-align:center;margin-top:8px;text-shadow:0 1px 8px rgba(30,24,40,.35)}
.lock-time{font-size:64px;font-weight:200;letter-spacing:-3px;line-height:1.06;text-align:center;margin:2px 0 0;text-shadow:0 2px 20px rgba(30,24,40,.30);font-variant-numeric:tabular-nums}
.lock-quote{text-align:center;font-size:11.5px;opacity:.9;margin-top:2px;letter-spacing:.2px;text-shadow:0 1px 8px rgba(30,24,40,.4)}
.lock-notis{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.lock-note{
  display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:18px;
  background:rgba(255,255,255,.17);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border:1px solid rgba(255,255,255,.24);box-shadow:0 6px 18px rgba(30,24,40,.14);
  animation:noteIn .5s backwards;cursor:pointer;
}
.lock-note:nth-child(1){animation-delay:.15s}
.lock-note:nth-child(2){animation-delay:.28s}
.lock-note:nth-child(3){animation-delay:.41s}
@keyframes noteIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lock-note .ln-ico{width:32px;height:32px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;overflow:hidden;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.lock-note .ln-main{min-width:0;flex:1}
.lock-note .ln-top{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;opacity:.9;font-weight:700;letter-spacing:.2px}
.lock-note .ln-title{font-size:12.5px;font-weight:700;margin:2px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock-note .ln-body{font-size:11.5px;line-height:1.5;opacity:.94;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lock-bottom{padding:14px 0 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.lock-hint{font-size:11.5px;letter-spacing:.3px;opacity:.88;display:flex;flex-direction:column;align-items:center;gap:5px;animation:hintFloat 2.6s ease-in-out infinite}
@keyframes hintFloat{0%,100%{transform:translateY(0);opacity:.82}50%{transform:translateY(-5px);opacity:1}}
.lock-unlock-btn{margin-top:2px;font-size:12.5px;font-weight:800;color:#4A3F58;background:rgba(255,255,255,.9);padding:11px 26px;border-radius:99px;box-shadow:0 8px 20px rgba(30,24,40,.22);display:flex;align-items:center;gap:7px}
.lock-unlock-btn:active{transform:scale(.96)}
.lock-drag{position:absolute;left:0;right:0;bottom:44px;height:64px;z-index:3;touch-action:none}
.lock-homebar{width:132px;height:5px;border-radius:99px;background:rgba(255,255,255,.72);margin:0 auto 6px}

/* ============================================================
   3. 홈 화면
   ============================================================ */
.applayer{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;z-index:10}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--cream);overflow:hidden}
.view.anim{animation:viewIn .3s cubic-bezier(.22,.85,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
.view.anim-back{animation:viewBack .26s cubic-bezier(.22,.85,.3,1)}
@keyframes viewBack{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.view-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:14px}

.home{position:absolute;inset:0;display:flex;flex-direction:column;background:transparent}
.home-bg{position:absolute;inset:0;overflow:hidden}
.home-bg svg{width:100%;height:100%}
.home-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,250,247,.55) 0%,rgba(255,250,247,.30) 30%,rgba(253,244,240,.62) 100%)}
.home-scroll{position:relative;z-index:2;flex:1;overflow-y:auto;padding:4px 22px 10px;overscroll-behavior:contain}
.home-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:4px 0 14px}
.home-hello{font-size:11.5px;color:#7E6E86;font-weight:700;letter-spacing:.3px}
.home-name{font-size:21px;font-weight:800;letter-spacing:-.7px;margin:2px 0 0;color:#463C50;display:flex;align-items:center;gap:6px}
.home-name .hnspark{font-size:15px}
.profile-mini{width:38px;height:38px;border-radius:50%;overflow:hidden;box-shadow:0 3px 10px rgba(94,74,105,.18);border:2px solid rgba(255,255,255,.9);flex:0 0 auto}

/* 위젯 공통 */
.widget{border-radius:var(--r-lg);padding:15px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.w-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.w-label{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.62}
.w-more{font-size:10.5px;font-weight:700;opacity:.55}

.widget-dday{background:linear-gradient(135deg,#FFEFF3 0%,#F7E4F1 46%,#E9E2FA 100%);box-shadow:0 8px 22px rgba(214,160,186,.24);margin-bottom:10px}
.dday-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.dday-num{font-size:31px;font-weight:900;letter-spacing:-1.6px;color:#8A4C67;line-height:1;font-variant-numeric:tabular-nums}
.dday-num small{font-size:13px;font-weight:800;margin-left:1px;letter-spacing:0}
.dday-cap{font-size:11px;font-weight:700;color:#8A6478;margin-top:5px}
.dday-art{width:74px;height:56px;flex:0 0 auto;opacity:.95}
.dday-stats{display:flex;gap:6px;margin-top:11px}
.dday-stat{flex:1;background:rgba(255,255,255,.66);border-radius:11px;padding:7px 8px;text-align:center;backdrop-filter:blur(4px)}
.dday-stat b{display:block;font-size:12.5px;letter-spacing:-.2px;color:#6C4A5C}
.dday-stat span{font-size:9.5px;color:#9A7C8B;font-weight:700;letter-spacing:.3px}

.widget-live{background:linear-gradient(140deg,#3B3348,#514560 55%,#6A5878);color:#fff;box-shadow:0 10px 24px rgba(59,51,72,.30);margin-bottom:10px;padding:14px 16px}
.live-top{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;letter-spacing:1px;color:#F7C6D0}
.live-dot{width:6px;height:6px;border-radius:50%;background:#FF9FB4;box-shadow:0 0 0 0 rgba(255,159,180,.7);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,159,180,.6)}70%{box-shadow:0 0 0 8px rgba(255,159,180,0)}100%{box-shadow:0 0 0 0 rgba(255,159,180,0)}}
.live-title{font-size:15px;font-weight:800;letter-spacing:-.4px;margin:6px 0 3px}
.live-sub{font-size:11px;opacity:.72;line-height:1.5}
.live-time{font-size:10.5px;margin-top:8px;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);padding:4px 9px;border-radius:99px;letter-spacing:.2px}

.widget-memo{background:#FFFDF9;border:1px solid rgba(57,49,63,.06);box-shadow:var(--shadow-sm);margin-bottom:10px}
.memo-note{font-size:12px;line-height:1.7;color:#5D5266;white-space:pre-line;max-height:66px;overflow:hidden}
.memo-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:10px;color:#B0A5B8;font-weight:700}

/* 앱 그리드 */
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;margin:18px 2px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.app-ico{
  width:56px;height:56px;border-radius:16px;display:grid;place-items:center;position:relative;
  box-shadow:0 6px 14px rgba(94,74,105,.16),inset 0 0 0 1px rgba(255,255,255,.25);
  transition:transform .16s ease,box-shadow .16s ease;overflow:hidden;
}
.app:active .app-ico{transform:scale(.92);box-shadow:0 3px 8px rgba(94,74,105,.16)}
.app-name{font-size:10.5px;font-weight:700;color:#5C5166;letter-spacing:-.2px;text-align:center;line-height:1.25}
.app-badge{position:absolute;top:-4px;right:6px;min-width:17px;height:17px;border-radius:99px;background:#EE7B8E;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px #FBF4EF;letter-spacing:-.2px}

/* 하단 폰 내비게이션 */
.phone-nav{position:relative;z-index:20;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:2px 22px 8px;background:linear-gradient(180deg,rgba(253,248,245,0),rgba(253,248,245,.92) 40%);}
.phone-nav .pn-btn{
  display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#6C6078;
  background:rgba(255,255,255,.86);padding:7px 12px;border-radius:99px;
  box-shadow:0 2px 8px rgba(94,74,105,.10);border:1px solid rgba(57,49,63,.05);
  transition:transform .15s,opacity .2s;
}
.phone-nav .pn-btn:active{transform:scale(.94)}
.phone-nav .pn-btn.off{opacity:.32;pointer-events:none}
.phone-nav .pn-dot{width:118px;height:5px;border-radius:99px;background:#443A4E;opacity:.28}

/* ============================================================
   4. 공통 앱 크롬 / 리스트 / 버튼
   ============================================================ */
.appbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 18px 10px;
  background:var(--cream);border-bottom:1px solid var(--line);position:relative;z-index:5;
}
.appbar.tinted{background:linear-gradient(180deg,#FFF6F8,#FDF8F5);}
.appbar .ab-back{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow-xs);flex:0 0 auto}
.appbar .ab-title{font-size:16px;font-weight:800;letter-spacing:-.4px;flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.appbar .ab-sub{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:-.1px}
.appbar .ab-act{font-size:11.5px;font-weight:800;color:var(--pink-deep);background:#FFF0F4;padding:6px 11px;border-radius:99px;flex:0 0 auto}

.sect{padding:16px 18px 4px}
.sect-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;padding:0 2px}
.sect-title{font-size:13px;font-weight:800;letter-spacing:-.3px;color:#4B4155}
.sect-sub{font-size:10.5px;color:var(--muted);font-weight:600}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);border:1px solid rgba(57,49,63,.045)}
.chip-row{display:flex;gap:7px;overflow-x:auto;padding:2px 18px 10px;scrollbar-width:none}
.chip{flex:0 0 auto;font-size:11.5px;font-weight:700;color:#6E6279;background:#fff;border:1px solid rgba(57,49,63,.07);padding:7px 13px;border-radius:99px;box-shadow:0 1px 3px rgba(94,74,105,.05);transition:all .16s;letter-spacing:-.2px}
.chip:active{transform:scale(.95)}
.chip.on{background:linear-gradient(135deg,#F9D3DE,#E7DDF8);color:#6B4560;border-color:transparent;box-shadow:0 4px 12px rgba(214,160,186,.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:800;padding:11px 16px;border-radius:14px;background:#F4EEF6;color:#5D5268;transition:transform .14s,filter .14s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#F4B8C9,#DCB6E4 55%,#BFB2EC);color:#523A56;box-shadow:0 8px 18px rgba(214,160,186,.34)}
.btn.dark{background:#3B3348;color:#fff}
.btn.block{width:100%}
.avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:var(--lav-soft)}
.tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.4px;color:#9A6E82;background:#FDEFF3;padding:3px 7px;border-radius:6px}
.tiny{font-size:10.5px;color:var(--muted);font-weight:600}
.divider{height:1px;background:var(--line);margin:12px 0}
.empty-note{padding:26px 18px;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
.disclaimer{margin:12px 18px 4px;padding:9px 12px;border-radius:12px;background:#FBF4F7;border:1px dashed rgba(214,160,186,.5);font-size:10.5px;line-height:1.6;color:#9B7C8A}

/* 토스트 & 시트 */
.toast{
  position:absolute;left:50%;bottom:74px;transform:translate(-50%,14px);z-index:200;
  background:rgba(56,48,64,.94);color:#fff;font-size:11.5px;font-weight:700;padding:10px 16px;border-radius:99px;
  box-shadow:0 10px 24px rgba(40,32,48,.3);opacity:0;pointer-events:none;transition:all .26s;max-width:84%;text-align:center;line-height:1.5;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet-wrap{position:absolute;inset:0;z-index:150;display:none}
.sheet-wrap.open{display:block}
.sheet-veil{position:absolute;inset:0;background:rgba(46,38,54,.36);backdrop-filter:blur(2px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:#FFFCFA;border-radius:26px 26px 0 0;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(60,48,70,.24);
  animation:sheetUp .3s cubic-bezier(.2,.9,.3,1);max-height:82%;overflow-y:auto;
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-grab{width:42px;height:4px;border-radius:99px;background:#E4DAE8;margin:0 auto 14px}
.sheet h3{font-size:16px;font-weight:800;letter-spacing:-.4px;margin:0 0 6px}
.sheet p{font-size:12px;line-height:1.7;color:#7A6E86;margin:0 0 14px}

/* ============================================================
   5. APP 01 버블
   ============================================================ */
.bubble-wrap{background:linear-gradient(180deg,#FBF1F4,#F7F1FB 40%,#FDF8F5)}
.bubble-head{
  flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:10px 18px 12px;
  background:rgba(255,252,253,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.bubble-head .bh-ava{width:42px;height:42px;border-radius:50%;overflow:hidden;box-shadow:0 3px 10px rgba(94,74,105,.18);border:2px solid #fff;flex:0 0 auto}
.bubble-head .bh-name{font-size:14.5px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:4px}
.verified{width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,#F2A8BE,#B9A8E8);display:inline-grid;place-items:center;color:#fff;font-size:8px;font-weight:900}
.bubble-head .bh-sub{font-size:10.5px;color:#A0909F;font-weight:600;margin-top:1px}
.bubble-head .bh-right{margin-left:auto;display:flex;gap:6px}
.icon-btn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow-xs);color:#6B5F78}
.bubble-body{flex:1;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:3px}
.bubble-note{margin:0 auto 12px;text-align:center;font-size:9.5px;line-height:1.6;color:#A795A2;background:rgba(255,255,255,.8);padding:7px 12px;border-radius:12px;max-width:88%;border:1px dashed rgba(214,160,186,.45)}

  function initialAvatar(name, size) {
    const s = size || 34;
    const pal = [['#F7D9E3', '#C98BA6'], ['#DCD6F5', '#8B7CC4'], ['#F7E5CE', '#B58C55'], ['#D3E8E2', '#5F9C8B'], ['#E7DBF7', '#9B84C8'], ['#FBE0D4', '#C4876B']];
    let h = 0; for (let i = 0; i < String(name).length; i++) h = (h * 31 + String(name).charCodeAt(i)) % 997;
    const c = pal[h % pal.length];
    const ch = String(name).trim().slice(0, 1) || '?';
    return '<svg viewBox="0 0 100 100" width="' + s + '" height="' + s + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      '<rect width="100" height="100" fill="' + c[0] + '"/>' +
      '<text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="44" font-weight="800" fill="' + c[1] + '" font-family="sans-serif">' + esc(ch) + '</text>' +
      '</svg>';
  }

  const LS_KEY = 'yeonseok-fan-phone.v1';

  function loadState() {
    const base = makeDefaults();
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { saved = null; }
    if (!saved || saved.version !== base.version) return base;
    // 앱별로 안전하게 병합 (구버전/손상 데이터 방어)
    ['bubble', 'community', 'x', 'insta', 'netflix', 'baemin', 'gpt'].forEach(function (k) {
      if (saved[k] && typeof saved[k] === 'object') base[k] = Object.assign(base[k], saved[k]);
    });
    if (!Array.isArray(base.bubble.msgs) || !base.bubble.msgs.length) base.bubble = makeDefaults().bubble;
    return base;
  }
  let state = loadState();
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경 무시 */ }
  }

  const START_DATE = new Date(2023, 10, 15); // 덕질 시작일 (D+1096 = 2026-11-15)
  function ddayCount() {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.max(0, Math.floor((t - START_DATE) / 86400000));
  }
  function msUntil(hour, min) {
    const now = new Date();
    const t = new Date(now); t.setHours(hour, min, 0, 0);
    return t - now;
  }
  function countdownText(ms) {
    if (ms <= 0) return '곧 시작';
    const total = Math.floor(ms / 1000);
    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s2 = total % 60;
    if (h > 0) return h + '시간 ' + m + '분 남음';
    if (m > 0) return m + '분 ' + s2 + '초 남음';
    return s2 + '초 남음';
  }

  function tickClock() {
    const d = new Date();
    const t = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    const sb = $('#sbTime'); if (sb) sb.textContent = t;
    const lt = $('#lockTime'); if (lt) lt.textContent = t;
    const ld = $('#lockDate'); if (ld) ld.textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DAYS[d.getDay()];
    const cd = $('#liveCountdown');
    if (cd) {
      const ms = msUntil(21, 50);
      const msEnd = msUntil(23, 10);
      if (ms > 0) cd.textContent = '본방까지 ' + countdownText(ms);
      else if (msEnd > 0) cd.textContent = '지금 본방 중 · 23:10 종료';
      else cd.textContent = '오늘 본방 종료 · 내일 다시';
    }
  }

  function route() { return nav.stack[nav.stack.length - 1]; }
  function routeKey() { const r = route(); return r.name + (r.id ? ':' + r.id : ''); }

  function go(next, opts) {
    opts = opts || {};
    const cur = route();
    if (cur.name === next.name && cur.id === next.id) return;
    saveScroll();
    nav.stack.push(next);
    render({ anim: 'in', resetScroll: true });
    syncBrowserHistory('push');
  }
  function goBack() {
    if (nav.stack.length <= 1) return;
    saveScroll();
    nav.stack.pop();
    render({ anim: 'back' });
    syncBrowserHistory('back', true);
  }
  function goHome() {
    if (route().name === 'home') { ui.locked = false; return; }
    saveScroll();
    nav.stack = [{ name: 'home' }];
    render({ anim: 'back' });
    syncBrowserHistory('home', true);
  }
  function saveScroll() {
    const b = $('.view-body');
    if (b) ui.scroll[routeKey()] = b.scrollTop;
  }
  function syncBrowserHistory(kind) {
    try {
      if (kind === 'push') history.pushState({ ys: nav.stack.length }, '');
      else history.replaceState({ ys: nav.stack.length }, '');
    } catch (e) { /* file:// 등에서 무시 */ }
  }

  const ACTIONS = {};

  function render(opts) {
    opts = opts || {};
    const r = route();
    const layer = $('#appLayer');
    if (!layer) return;
    const focused = document.activeElement;
    const focusId = focused && focused.id ? focused.id : null;
    let html = '';
    html += '<div class="view ' + (opts.anim === 'in' ? 'anim' : opts.anim === 'back' ? 'anim-back' : '') + '">' + viewHTML() + '</div>';
    if (ui.story) html += storyHTML();
    layer.innerHTML = html;
    // 잠금 화면은 상태 표시줄/하단 내비까지 덮도록 screen 바로 아래에 둔다
    let lockLayer = document.getElementById('lockLayer');
    if (ui.locked) {
      if (!lockLayer) {
        lockLayer = document.createElement('div');
        lockLayer.id = 'lockLayer';
        lockLayer.className = 'lock-layer';
        $('#screen').insertBefore(lockLayer, layer);
      }
      lockLayer.innerHTML = lockHTML();
    } else if (lockLayer) {
      lockLayer.parentNode.removeChild(lockLayer);
    }
    // 스크롤 복원
    const body = $('.view-body');
    if (body) {
      const key = routeKey();
      body.scrollTop = opts.resetScroll ? 0 : (ui.scroll[key] || 0);
    }
    // 포커스 복원
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el && typeof el.focus === 'function') {
        try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
      }
    }
    // 상태 표시줄 색상
    const sb = $('#statusbar');
    const dark = ui.locked || r.name === 'netflix';
    if (sb) sb.classList.toggle('dark', !!dark);
    const screenEl = $('#screen');
    if (screenEl) screenEl.classList.toggle('dark-app', r.name === 'netflix');
    // 내비 버튼
    const nb = $('#navBack');
    if (nb) nb.classList.toggle('off', ui.locked || nav.stack.length <= 1);
    const nh = $('#navHome');
    if (nh) nh.classList.toggle('off', !!ui.locked);
    updateBadges();
    if (r.name === 'bubble') scrollBubbleToEnd(opts.resetScroll);
    if (r.name === 'gptChat') scrollGptToEnd();
  }

  }

  function lcg(seed) {
    let s = (seed * 9301 + 49297) % 233280;
    return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  }
  function syntheticFans(seed, n) {
    const rnd = lcg(seed + 7);
    const out = [];
    for (let i = 0; i < n; i++) {
      const nick = FAN_NICKS[Math.floor(rnd() * FAN_NICKS.length)];
      const base = rnd() > 0.45 ? FAN_TEXTS : FAN_EXTRA;
      const text = base[Math.floor(rnd() * base.length)];
      out.push({ nick: nick, text: text, mins: 8 + Math.floor(rnd() * 180) });
    }
    return out;
  }
  function applyNick(text) {
    return String(text).replace(/@@@/g, '@@@NICK@@@');

      else {

        cur.fans.push(m);
      }
    });
    return rounds;
  }

  function artistReplyFor(text) {
    const t = String(text).toLowerCase();
    let best = null, bestScore = 0;
    ARTIST_REPLIES.forEach(function (rule) {
      let score = 0;
      rule.k.forEach(function (kw) { if (t.indexOf(kw) >= 0) score += 1; });
      if (score > bestScore) { bestScore = score; best = rule; }
    });
    if (!best) best = ARTIST_REPLIES[0];
    const key = best.k[0];
    ui.replyMemory = ui.replyMemory || {};
    const used = ui.replyMemory[key] || [];
    let idx = Math.floor(Math.random() * best.v.length);
    let guard = 0;
    while (used.indexOf(idx) >= 0 && guard < 20) { idx = (idx + 1) % best.v.length; guard++; }
    used.push(idx);
    if (used.length > best.v.length - 1) used.shift();
    ui.replyMemory[key] = used;
    return best.v[idx];
  }

  ACTIONS.bmCat = function (el) {
    ui.bmCat = el.dataset.cat;
    render({ resetScroll: true });
  };
  ACTIONS.bmClearSearch = function () {
    ui.bmSearch = '';
    ui.drafts.bmSearch = '';
    render();
  };
  ACTIONS.openStore = function (el) { go({ name: 'store', id: el.dataset.id }); };
  ACTIONS.bmFav = function (el) {
    const id = el.dataset.id;
    const i = state.baemin.favs.indexOf(id);
    if (i >= 0) { state.baemin.favs.splice(i, 1); toast('찜한 가게에서 뺐어요'); }
    else { state.baemin.favs.push(id); toast('찜한 가게에 담았어요'); }
    save(); render();
  };
  ACTIONS.addCart = function (el) {
    const storeId = el.dataset.store, menuId = el.dataset.menu;
    const m = bmMenu(storeId, menuId);
    if (!m) return;
    if (state.baemin.cart.length && state.baemin.cart[0].storeId !== storeId) {
      state.baemin.cart = [];
      toast('다른 가게 메뉴로 장바구니를 새로 담았어요');
    }
    const line = state.baemin.cart.find(function (c) { return c.menuId === menuId; });
    if (line) line.qty += 1; else state.baemin.cart.push({ storeId: storeId, menuId: menuId, qty: 1 });
    save(); render();
    toast(m.name + ' 담았어요');
  };
  ACTIONS.qtyPlus = function (el) {
    const c = state.baemin.cart.find(function (x) { return x.menuId === el.dataset.menu; });
    if (!c) return;
    c.qty += 1; save(); render();
  };
  ACTIONS.qtyMinus = function (el) {
    const id = el.dataset.menu;
    const c = state.baemin.cart.find(function (x) { return x.menuId === id; });
    if (!c) return;
    c.qty -= 1;
    if (c.qty <= 0) state.baemin.cart = state.baemin.cart.filter(function (x) { return x.menuId !== id; });
    save(); render();
  };
  ACTIONS.clearCart = function () { state.baemin.cart = []; save(); render(); toast('장바구니를 비웠어요'); };
  ACTIONS.openCart = function () { go({ name: 'cart' }); };
  ACTIONS.doOrder = function () {
    const d = cartDetail();
    if (!d.lines.length) { toast('장바구니가 비어 있어요'); return; }
    const st = bmStore(d.lines[0].c.storeId);
    const items = d.lines.map(function (l) { return l.m.name + ' ' + l.c.qty; }).join(' · ');
    const orderNo = '주문번호 #' + Math.floor(100000 + Math.random() * 899999);
    state.baemin.orders.unshift({
      id: uid('o'), storeId: st.id, date: (new Date().getMonth() + 1) + '월 ' + new Date().getDate() + '일 ' + fmtShort(new Date()),
      amount: d.total, items: items, rating: 5, review: '시뮬레이터에서 담은 가상 주문이에요. 오늘 본방도 화이팅!'
    });
    ui.orderDone = { storeName: st.name, items: items, total: d.total, orderNo: orderNo };
    state.baemin.cart = [];
    save(); render();
  };
  ACTIONS.closeOrderDone = function () {
    ui.orderDone = null;
    ui.scroll = {};
    nav.stack = [{ name: 'home' }, { name: 'baemin' }];
    render({ anim: 'back', resetScroll: true });
    toast('주문 내역 맨 위에 추가됐어요');
  };
  ACTIONS.reorder = function (el) {
    const o = state.baemin.orders.find(function (x) { return x.id === el.dataset.id; });
    if (!o) return;
    const st = bmStore(o.storeId);
    let added = 0;
    state.baemin.cart = [];
    (st.menu || []).forEach(function (m) {
      if (o.items.indexOf(m.name) >= 0) { state.baemin.cart.push({ storeId: st.id, menuId: m.id, qty: 1 }); added++; }
    });
    if (!added && st.menu.length) state.baemin.cart.push({ storeId: st.id, menuId: st.menu[0].id, qty: 1 });
    save();
    go({ name: 'cart' });
    toast('지난 주문을 장바구니에 담았어요');
  };

      '〈라이어〉 7회 포인트 세 개만 짚어 볼게요.\n\n· 부제 「몬스터」 — 누가 괴물이 되는지가 이번 화의 질문이에요. 민준호인지, 아니면 그를 몰아가는 사람인지.\n· 시선 — 5·6회에서 카메라가 민준호를 계속 “관찰자” 위치에 뒀어요. 7회엔 그 구도가 뒤집힐 가능성이 커요.\n· 대사 — 배우님이 “결말이 아니라 그 앞 대사 한 줄”이라고 했으니, 마지막 5분 대사를 잘 들어 보세요.\n\n본방 9시 50분, 준비물은 떡볶이와 쿠션입니다.'
    ] },
    { k: ['대본집', '소장', '예판', '굿즈'], a: [
      '대본집은 보통 방영 종료 후 2~3개월 안에 예판이 뜨는 편이에요.\n\n준비해 둘 것:\n· 출판사 알림 설정 + 예판 특전(포토카드·저자 사인본) 확인\n· eBook 동시 출간 여부 — 종이책 특전이 없는 경우가 많아요.\n· 이미 소장 중인 세 권(사랑의 이해·운수 오진 날·지금 거신 전화는)과 서가 정리해 두기 ㅎㅎ\n\n소식 뜨면 알려 드릴게요.'
    ] }
  ];
  function gptAnswer(q) {
    const t = String(q).toLowerCase();
    let best = null, score = 0;
    GPT_RULES.forEach(function (r) {
      let s = 0;
      r.k.forEach(function (k) { if (t.indexOf(k) >= 0) s++; });
      if (s > score) { score = s; best = r; }
    });
    if (best) return pick(best.a, Date.now());
    return '좋은 질문이에요. 제가 도와드릴 수 있는 건 이런 것들이에요.\n\n· 오늘의 주접 멘트 / 팬레터 문장 다듬기\n· 사진 감상 포인트 정리\n· 차기작·드라마 결말 궁예\n· 팬미팅 질문 추천\n· 헤드윅 티켓팅 준비\n· 덕질하다 지칠 때 마음 정리\n\n예를 들어 “오늘 주접 한 줄 써 줘”라고 하시면 바로 만들어 드릴게요.';
  }
  ACTIONS.openGpt = function (el) { go({ name: 'gptChat', id: el.dataset.id }); };
  ACTIONS.gptNew = function () {
    const id = uid('g');
    state.gpt.chats.unshift({ id: id, title: '새 대화', icon: '✨', ts: Date.now(), messages: [
      { role: 'ai', text: '안녕하세요, 상미님. 오늘은 어떤 덕질 이야기를 해 볼까요?\n\n주접 멘트, 팬레터, 작품 분석, 티켓팅 준비까지 도와드릴게요.' }
    ] });
    save();
    go({ name: 'gptChat', id: id });
  };
  ACTIONS.gptSuggest = function (el) {
    const ta = $('#gptInput');
    if (!ta) return;
    ui.drafts.gpt = el.dataset.text || '';
    ta.value = ui.drafts.gpt;
    ta.focus();
  };
  ACTIONS.gptSend = function () {
    const r = route();
    if (r.name !== 'gptChat') return;
    const c = gptChat(r.id);
    const ta = $('#gptInput');
    const text = (ta && ta.value || '').trim();
    if (!c || !text) { if (!text) toast('메시지를 입력해 주세요'); return; }
    c.messages.push({ role: 'user', text: text });
    if (c.title === '새 대화' || !c.title) c.title = text.slice(0, 24);
    c.ts = Date.now();
    ui.drafts.gpt = '';
    save(); render();
    scrollGptToEnd();
    ui.gptTyping = true;
    setTimeout(function () {
      if (route().name !== 'gptChat' || route().id !== r.id) { ui.gptTyping = false; save(); return; }
      render(); scrollGptToEnd();
    }, 250);
    setTimeout(function () {
      ui.gptTyping = false;
      c.messages.push({ role: 'ai', text: gptAnswer(text) });
      c.ts = Date.now();
      save();
      if (route().name === 'gptChat' && route().id === r.id) { render(); scrollGptToEnd(); }
    }, 1500);
  };

  /* ==========================================================
     R. 설정 · 초기화
     ========================================================== */
  function openSettings() {
    openSheet('<h3>시뮬레이터 설정</h3>' +
      '<p>모든 화면은 가상이며, 실제 결제·전송·게시는 일어나지 않아요. 상태는 이 브라우저에만 저장됩니다.</p>' +
      '<div class="set-row"><div>자동 저장<small class="sr-sub">새로고침해도 메시지·좋아요·장바구니가 유지돼요</small></div><span class="mini-toggle on"></span></div>' +
      '<div class="set-row"><div>내 애칭<small class="sr-sub">버블 @@@ 자리에 들어가는 이름</small></div><b style="color:#8A4C67">' + esc(state.bubble.nickname || '상미') + '</b></div>' +
      '<div class="set-row"><div>덕질 시작일<small class="sr-sub">D+' + ddayCount() + ' · 2023.11.15</small></div><small>3년 차</small></div>' +
      '<div class="set-row"><div>저장된 데이터<small class="sr-sub">메시지 ' + state.bubble.msgs.length + '개 · 게시물 ' + state.community.posts.length + '개 · 트윗 ' + state.x.tweets.length + '개</small></div><small>localStorage</small></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">' +
        '<button class="btn block" data-act="lock">🔒 폰 잠그기</button>' +
        '<button class="btn block" data-act="resetAsk" style="color:#C06A5A;background:#FDEFEA">모든 상태 초기화</button>' +
        '<button class="btn block" data-act="closeSheet">닫기</button>' +
      '</div>' +
      '<div style="margin-top:14px;text-align:center;font-size:9.5px;line-height:1.7;color:#B0A5B8">실제 유연석 배우 및 소속사와 무관한 팬 창작 시뮬레이터입니다.</div>');
  }
  ACTIONS.resetAsk = function () {
    openSheet('<h3>정말 초기화할까요?</h3>' +
      '<p>보낸 메시지, 좋아요, 댓글, 장바구니, 새 게시물이 모두 처음 상태로 돌아가요. 이 작업은 되돌릴 수 없어요.</p>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="btn block" data-act="closeSheet">취소</button>' +
        '<button class="btn block primary" data-act="resetAll" style="background:#E8899A;color:#fff">초기화</button>' +
      '</div>');
  };
  ACTIONS.resetAll = function () {
    try { localStorage.removeItem(LS_KEY); } catch (e) { }
    state = makeDefaults();
    ui.drafts = {}; ui.gptTyping = false; ui.typing = false; ui.expandedFan = null;
    ui.orderDone = null; ui.player = null; ui.story = null; ui.bmCat = '전체'; ui.bmSearch = '';
    nav.stack = [{ name: 'home' }];
    closeSheet(); render({ resetScroll: true });
    toast('처음 상태로 초기화했어요');
  };

  /* ==========================================================
     S. 뷰 디스패처 · 이벤트 · 초기화
     ========================================================== */
  function viewHTML() {
    const r = route();
    switch (r.name) {
      case 'home': return homeHTML();
      case 'bubble': return bubbleHTML();
      case 'community': return communityHTML();
      case 'post': return appbar('게시물', '', { tint: true, right: '' }) + postHTML(r.id);
      case 'x': return xHTML();
      case 'insta': return instaHTML();
      case 'igPost': return igPostHTML(r.id);
      case 'netflix': return netflixHTML();
      case 'nfDetail': return nfDetailHTML(r.id);
      case 'baemin': return baeminHTML();
      case 'store': return storeHTML(r.id);
      case 'cart': return cartHTML();
      case 'gpt': return gptListHTML();
      case 'gptChat': return gptChatHTML(r.id);
      default: return homeHTML();
    }
  }

  function bindLockSwipe() {
    const drag = $('#lockScreen') || $('#lockDrag');
    if (!drag) return;
    let startY = null, dy = 0;
    const lock = $('#lockScreen');
    drag.addEventListener('pointerdown', function (e) {
      if (e.target.closest && e.target.closest('button')) return;
      startY = e.clientY; dy = 0;
      if (lock) lock.style.transition = 'none';
    });
    drag.addEventListener('pointermove', function (e) {
      if (startY === null) return;
      dy = Math.min(0, e.clientY - startY);
      if (lock) { lock.style.transform = 'translateY(' + dy + 'px)'; lock.style.opacity = String(Math.max(0.25, 1 + dy / 620)); }
    });
    function end() {
      if (startY === null) return;
      const passed = dy < -80;
      startY = null;
      if (lock) { lock.style.transition = ''; lock.style.transform = ''; lock.style.opacity = ''; }
      if (passed) ACTIONS.unlock();
    }
    drag.addEventListener('pointerup', end);
    drag.addEventListener('pointercancel', end);
  }

  function init() {
    const icons = $('#sbIcons');
    if (icons) icons.innerHTML = statusBarIcons();
    render();
    tickClock();
    setInterval(tickClock, 1000);
    try { history.replaceState({ ys: 1 }, ''); } catch (e) { }

    // 클릭 위임
    document.addEventListener('click', function (e) {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) return;
      const act = el.dataset.act;
      if (!ACTIONS[act]) return;
      if (e.target.closest('input, textarea') && act !== 'igFocusComment') return;
      if (el.disabled) return;
      e.preventDefault();
      ACTIONS[act](el, e);
    });

    // 입력 위임
    document.addEventListener('input', function (e) {
      const t = e.target;
      if (!t || !t.id) return;
      if (t.tagName === 'TEXTAREA') {
        t.style.height = 'auto';
        t.style.height = Math.min(88, t.scrollHeight) + 'px';
      }
      switch (t.id) {
        case 'bubbleInput':
          ui.drafts[state.bubble.view === 'artist' ? 'bubbleArtist' : 'bubbleFan'] = t.value;
          break;
        case 'commentInput':
          ui.drafts['comment_' + t.dataset.id] = t.value;
          break;
        case 'igCommentInput':
          ui.drafts['ig_' + (route().id || '')] = t.value;
          break;
        case 'gptInput':
          ui.drafts.gpt = t.value;
          break;
        case 'xInput':
          ui.drafts.x = t.value;
          break;
        case 'bmSearch':
          ui.bmSearch = t.value;
          ui.drafts.bmSearch = t.value;
          bmSearchFilter(t.value);
          break;
      }
    });

    // 키 입력
    document.addEventListener('keydown', function (e) {
      const t = e.target;
      if (!t || !t.id) return;
      if (e.key !== 'Enter') return;
      if (t.id === 'bubbleInput') {
        if (e.shiftKey) return;
        e.preventDefault();
        ACTIONS[state.bubble.view === 'artist' ? 'artistSend' : 'bubbleSend']();
      } else if (t.id === 'commentInput') {
        e.preventDefault();
        ACTIONS.addComment({ dataset: { id: t.dataset.id } });
      } else if (t.id === 'igCommentInput') {
        e.preventDefault();
        ACTIONS.igAddComment({ dataset: { id: route().id } });
      } else if (t.id === 'gptInput') {
        if (e.shiftKey) return;
        e.preventDefault();
        ACTIONS.gptSend();
      }
    });

    // 브라우저 뒤로 가기
    window.addEventListener('popstate', function () {
      if (ui.story) { ACTIONS.closeStory(); return; }
      if (ui.sheet) { closeSheet(); return; }
      if (nav.stack.length > 1) {
        saveScroll();
        nav.stack.pop();
        render({ anim: 'back' });
      }
    });

    // 잠금 스와이프 (잠금 화면이 렌더될 때마다 다시 연결)
    const origRender = render;
    // eslint-disable-next-line no-func-assign
    render = function (opts) { origRender(opts); bindLockSwipe(); };
    bindLockSwipe();
  }

  function bmSearchFilter(q) {
    // 검색은 렌더 없이 카드만 즉시 필터링 (포커스 유지)
    const lower = String(q || '').toLowerCase();
    const cards = $$('.bm-store[data-act="openStore"]');
    if (!cards.length) return;
    cards.forEach(function (card) {
      const name = card.textContent.toLowerCase();
      card.style.display = !lower || name.indexOf(lower) >= 0 ? '' : 'none';
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
