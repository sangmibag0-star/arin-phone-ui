<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FBF6F1" />
<title>폰 훔쳐보기 · 시뮬레이터 모음</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --cream:#FBF6F1; --ink:#2A2226; --sub:#8A7F86;
    --rose:#C97C97; --lilac:#8E7CC3; --line:rgba(42,34,38,.08);
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
    background:
      radial-gradient(120% 80% at 12% 0%, #FDEDF2 0%, rgba(253,237,242,0) 60%),
      radial-gradient(110% 70% at 92% 8%, #EFECFB 0%, rgba(239,236,251,0) 58%),
      var(--cream);
    color:var(--ink);
    min-height:100%;
    padding:max(28px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap{width:100%; max-width:520px}
  header{margin:8px 0 22px}
  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--rose); background:rgba(201,124,151,.10);
    border:1px solid rgba(201,124,151,.18);
    padding:6px 11px; border-radius:999px;
  }
  h1{font-size:26px; line-height:1.32; letter-spacing:-.02em; margin:14px 0 8px; font-weight:800}
  .lead{font-size:14px; line-height:1.6; color:var(--sub)}
  .cards{display:flex; flex-direction:column; gap:14px; margin-top:22px}
  a.card{
    display:flex; gap:16px; align-items:center;
    text-decoration:none; color:inherit;
    background:rgba(255,255,255,.82);
    border:1px solid var(--line);
    border-radius:22px; padding:16px;
    box-shadow:0 10px 26px -18px rgba(42,34,38,.45);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  a.card:active{transform:scale(.985)}
  @media (hover:hover){
    a.card:hover{transform:translateY(-2px); border-color:rgba(201,124,151,.35);
      box-shadow:0 18px 34px -20px rgba(42,34,38,.5)}
  }
  .thumb{
    flex:0 0 auto; width:76px; height:104px; border-radius:16px;
    position:relative; overflow:hidden; border:1px solid rgba(42,34,38,.10);
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);
  }
  .thumb::after{
    content:''; position:absolute; left:50%; transform:translateX(-50%);
    top:6px; width:26px; height:5px; border-radius:99px; background:rgba(255,255,255,.65);
  }
  .thumb.laier{background:linear-gradient(160deg,#3B2E3A 0%,#6B4560 55%,#C97C97 100%)}
  .thumb.fan{background:linear-gradient(160deg,#F4D9E3 0%,#FBF0F3 48%,#DDD3F2 100%)}
  .thumb .glyph{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:30px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.18));
  }
  .meta{min-width:0; flex:1}
  .tag{font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--rose)}
  .tag.lilac{color:var(--lilac)}
  .name{font-size:16.5px; font-weight:800; letter-spacing:-.01em; margin:5px 0 5px; line-height:1.35}
  .desc{font-size:12.5px; line-height:1.55; color:var(--sub);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .go{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%;
    display:grid; place-items:center; font-size:15px;
    background:rgba(201,124,151,.12); color:var(--rose); font-weight:700;
  }
  .go.lilac{background:rgba(142,124,195,.12); color:var(--lilac)}
  footer{margin-top:26px; font-size:11.5px; line-height:1.7; color:#A79CA3; text-align:center}
  .dot{display:inline-block; width:4px; height:4px; border-radius:50%; background:#D9CED4; margin:0 7px; vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">📱 폰 훔쳐보기</span>
    <h1>어느 폰을 열어볼까요?</h1>
    <p class="lead">둘 다 설치 없이 브라우저에서 바로 열려요. 홈 화면에 추가하면 앱처럼 쓸 수 있어요.</p>
  </header>

  <main class="cards">
    <a class="card" href="./min-junho.html">
      <div class="thumb laier"><span class="glyph">🎭</span></div>
      <div class="meta">
        <span class="tag">드라마 〈라이어〉</span>
        <p class="name">민준호의 iPhone</p>
        <p class="desc">메시지·사진·통화 기록까지, 민준호 폰을 살짝 들여다보는 시뮬레이터.</p>
      </div>
      <span class="go" aria-hidden="true">→</span>
    </a>

    <a class="card" href="./yeonseok-fan.html">
      <div class="thumb fan"><span class="glyph">💌</span></div>
      <div class="meta">
        <span class="tag lilac">유연석 찐팬</span>
        <p class="name">유연석 팬 폰</p>
        <p class="desc">홈 화면부터 팬 커뮤니티·버블·인스타·GPT까지, 덕질 폰 시뮬레이터.</p>
      </div>
      <span class="go lilac" aria-hidden="true">→</span>
    </a>
  </main>

  <footer>
    브라우저에서 열린 페이지예요<span class="dot"></span>기록은 이 기기에만 저장돼요
  </footer>
</div>
</body>
</html>
